name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  qa-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rye
        uses: eifinger/setup-rye@v4
        with:
          enable-cache: true

      - name: Synchronize dependencies
        run: |
          rye sync
          rye add --dev pytest-cov

      - name: Check migrations & apply database schema
        env:
          PYTHONPATH: src
        run: |
          rye run python manage.py makemigrations --check --dry-run
          rye run python manage.py migrate

      - name: Execute Unit & Query-Count Suite (pytest)
        env:
          PYTHONPATH: src
        run: rye run pytest --cov=django_octo_aurora --cov-report=xml

      - name: Execute Behavioral Specifications (behave)
        env:
          PYTHONPATH: src
        run: rye run behave

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

