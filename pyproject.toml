[build-system]
requires = ["hatchling<1.26"]
build-backend = "hatchling.build"

[project]
name = "django-octo-aurora"
version = "0.1.0"
description = "Decoupled Django runtime software topology visualizer and interactive architecture showcase module under the Django-Octo ecosystem."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "jeanpmodev", email = "jeanpmodev@gmail.com" }
]
keywords = ["django", "topology", "visualization", "architecture", "showcase", "django-octo", "introspection"]
classifiers = [
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "django>=6.1.2",
    "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/jeanpmodev/django_octo_aurora"
Repository = "https://github.com/jeanpmodev/django_octo_aurora"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "behave>=1.3.3",
    "behave-django>=2.0.0",
    "locust>=2.47.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_octo_aurora"]

[tool.hatch.build.targets.wheel.force-include]
"src/django_octo_aurora/templates" = "django_octo_aurora/templates"
"src/django_octo_aurora/migrations" = "django_octo_aurora/migrations"
